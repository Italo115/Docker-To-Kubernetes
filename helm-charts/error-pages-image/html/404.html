<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Platform · Not Found</title>
<link rel="stylesheet" href="/assets/error.css" />
</head>
<body>
<div class="err-page" id="errPage">
  <div class="page-bg"></div>

  <header class="brandbar">
    <img class="logo" src="/assets/logo.png" alt="Platform" />
    <div class="platform">Platform<small>Example Platform</small></div>
    <div class="status"><span class="chip-status is-info"><span class="dot"></span> Not Found</span></div>
  </header>

  <main class="stage">
    <section class="card">
      <div class="err-code">
        <svg class="contour-svg" viewBox="0 0 760 360" preserveAspectRatio="none" aria-hidden="true">
          <g id="contourGroup">
          <path d="M-40,70  C150,30 300,110 450,70  S700,30 820,74"  style="--len:1000;stroke-dasharray:1000"></path>
          <path d="M-40,120 C150,80 300,160 450,120 S700,80 820,124" style="--len:1000;stroke-dasharray:1000"></path>
          <path class="accent" d="M-40,180 C150,140 300,220 450,180 S700,140 820,184" style="--len:1000;stroke-dasharray:1000"></path>
          <path d="M-40,240 C150,200 300,280 450,240 S700,200 820,244" style="--len:1000;stroke-dasharray:1000"></path>
          <path d="M-40,290 C150,250 300,330 450,290 S700,250 820,294" style="--len:1000;stroke-dasharray:1000"></path>
          </g>
        </svg>
        <span class="digit">4</span><span class="digit accent">0</span><span class="digit">4</span>
        <span class="http fx fx-1">HTTP 404 · Not Found</span>
      </div>

      <div class="err-head">
        <h1 class="err-title fx fx-1">We couldn’t find that page</h1>
        <p class="err-body fx fx-2">
          The page you’re looking for doesn’t exist, may have moved, or the link
          was mistyped. Check the address or head back to Platform.
        </p>
      </div>

      <div class="actions fx fx-4">
        <a class="btn btn-primary" id="homeBtn" href="/"><i class="pi pi-home"></i> Go to Platform</a>
        <button class="btn btn-secondary" onclick="history.back()"><i class="pi pi-arrow-left"></i> Go Back</button>
      </div>
    </section>
  </main>
</div>

<script>
  // Point "Go to Platform" at the portal for the current environment.
  var sub = window.location.host.split('.')[0];
  var m = sub.match(/-(dev|qa|uat|prod)$/);
  var env = m ? m[1] : 'dev';
  document.getElementById('homeBtn').href = 'https://app-' + env + '.example.com';
</script>
<script src="/assets/error-fx.js"></script>
</body>
</html>
