server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  # Render the page body for each handled code while PRESERVING that status code.
  # error_page (without the "=" rewrite) keeps the triggering status on the response.
  error_page 401 404 500 501 502 503 504 @errorpage;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Static assets (shared CSS/JS, logo) — served as-is, never error-paged.
  location /assets/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Traefik's errors middleware requests /{status} (e.g. /503, /401). Re-emit it as
  # a real HTTP status so the client gets the actual code instead of a flat 200/500.
  # nginx's `return` only takes a literal, so we map the known set explicitly.
  location ~ "^/(?<code>[0-9]{3})$" {
    if ($code = 401) { return 401; }
    if ($code = 404) { return 404; }
    if ($code = 501) { return 501; }
    if ($code = 502) { return 502; }
    if ($code = 503) { return 503; }
    if ($code = 504) { return 504; }
    return 500;   # 500 and any other unmapped code
  }

  # Anything else (e.g. a bare "/") renders the generic server-error page.
  location / {
    return 500;
  }

  # Internal renderer: serves the dedicated page for the code if one exists
  # (401.html / 404.html), otherwise the generic page with the status substituted.
  # $status holds the real code here, so the response keeps it.
  location @errorpage {
    internal;
    add_header Cache-Control "no-store" always;
    sub_filter '__STATUS__' '$status';
    sub_filter_once on;
    sub_filter_types text/html;
    try_files /$status.html /index.html =404;
  }
}
