apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    {{- toYaml (.Values.deployment.strategy | default (dict "type" "RollingUpdate")) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "platform.component" . }}
        example.com/domain: {{ include "platform.domain" . }}
      annotations:
        {{- /* Roll the pod when the CNPG-issued secret rotates. */ -}}
        {{- if and .Values.database .Values.database.enabled }}
        reloader.stakater.com/auto: "true"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/managed-by: {{ .Release.Service }}
              example.com/domain: {{ include "platform.domain" . }}
      {{- end }}
      containers:
        - name: {{ include "platform.component" . }}
          image: {{ include "platform.image" . | quote }}
          imagePullPolicy: {{ .Values.global.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          {{- $env := concat (.Values.env | default list) (include "platform.dbStyleEnv" . | fromYamlArray) }}
          {{- if $env }}
          env:
            {{- toYaml $env | nindent 12 }}
          {{- end }}
          {{- $envFrom := list }}
          {{- with .Values.envFrom }}{{- $envFrom = concat $envFrom . }}{{- end }}
          {{- /* Only attach the chart-owned creds Secret when the chart owns it.
                 When database.owns.passwordSecret is set the app supplies DB_* itself. */}}
          {{- if and .Values.database .Values.database.enabled (not (and .Values.database.owns .Values.database.owns.passwordSecret)) }}
          {{- $envFrom = append $envFrom (dict "secretRef" (dict "name" (include "platform.dbOwnerSecret" .))) }}
          {{- end }}
          {{- if $envFrom }}
          envFrom:
            {{- toYaml $envFrom | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{/*
Inject auxiliary DB env vars in addition to the default envFrom block. Switched
on database.envStyle:
  none     — no extra env vars (the envFrom secretRef still exposes username/password/host/port/dbname/uri/jdbc-uri)
  spring   — SPRING_DATASOURCE_{USERNAME,PASSWORD,URL=jdbc-uri}
  postgres — POSTGRES_{USER,PASSWORD,HOST,PORT,DB}
*/}}
{{- define "platform.dbStyleEnv" -}}
{{- if and .Values.database .Values.database.enabled -}}
{{- $secret := include "platform.dbOwnerSecret" . -}}
{{- $style := .Values.database.envStyle | default "none" -}}
{{- if eq $style "spring" }}
- name: SPRING_DATASOURCE_USERNAME
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
- name: SPRING_DATASOURCE_PASSWORD
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
- name: SPRING_DATASOURCE_URL
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: jdbc-uri } }
{{- else if eq $style "postgres" }}
- name: POSTGRES_USER
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
- name: POSTGRES_PASSWORD
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
- name: POSTGRES_HOST
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: host } }
- name: POSTGRES_PORT
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: port } }
- name: POSTGRES_DB
  valueFrom: { secretKeyRef: { name: {{ $secret }}, key: dbname } }
{{- end }}
{{- end -}}
{{- end -}}
