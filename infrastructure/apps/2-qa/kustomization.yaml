apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apps enabled in qa. Listing = enabling. qa runs its own ImageUpdateAutomation
# (image-automation.yaml) — new -qa tags in Harbor are auto-bumped into each
# app's values-patch.yaml, same as dev.
resources:
  - department/application
  # Applications come here
  - image-automation.yaml
