apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-uat
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
    - name: secrets-uat
  interval: 5m
  path: ./apps/3-uat
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config-uat
