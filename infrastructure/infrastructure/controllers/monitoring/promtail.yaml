---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: promtail
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: "*"
  values:
    # promtail is a DaemonSet (one pod per node) that scrapes each node's logs.
    # Intentionally NOT pinned to the infra pool — pinning would drop logs from
    # every other node. Leave it cluster-wide.
    config:
      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
