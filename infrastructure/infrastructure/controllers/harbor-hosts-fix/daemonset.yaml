# Makes harbor.example.com resolve to the in-cluster Traefik ClusterIP on every NODE
# host (/etc/hosts), so kubelet/containerd image pulls route internally instead of
# to the public LB IP (<PUBLIC_LB_IP>, e.g. 203.0.113.10) which is unreachable from inside the cluster
# (no NAT hairpin). In-cluster pods are handled separately by the CoreDNS hosts block.
# Idempotent; re-asserts every 60s and on reboot; runs on every node incl. masters.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: harbor-hosts-fix
  namespace: kube-system
  labels:
    app.kubernetes.io/name: harbor-hosts-fix
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-hosts-fix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-hosts-fix
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists        # land on every node (masters + all pools)
      containers:
        - name: hosts
          image: docker.io/busybox:1.36   # docker.io reachable from nodes; Harbor is not (the bug this fixes)
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Replace <TRAEFIK_CLUSTER_IP> with the ClusterIP of your Traefik Service:
              #   kubectl -n traefik get svc traefik -o jsonpath='{.spec.clusterIP}'
              LINE='<TRAEFIK_CLUSTER_IP>  harbor.example.com'
              while true; do
                if ! grep -qxF "$LINE" /host/etc/hosts; then
                  # drop any stale harbor.example.com line, then append the correct one
                  sed -i '/[[:space:]]harbor\.example\.com$/d' /host/etc/hosts
                  printf '%s\n' "$LINE" >> /host/etc/hosts
                  echo "patched /etc/hosts -> $LINE"
                fi
                sleep 60
              done
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
          volumeMounts:
            - name: host-etc
              mountPath: /host/etc
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
