apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: error-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-pages
    spec:
      priorityClassName: infrastructure-critical
      nodeSelector:
        workload: infrastructure
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: nginx
          image: harbor.example.com/example/error-pages:0.5.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: error-pages
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: error-pages
  ports:
    - name: http
      port: 80
      targetPort: http
