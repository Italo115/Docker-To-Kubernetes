apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  chart:
    spec:
      chart: minio
      version: ">=5.0.0"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
  values:
    mode: standalone
    replicas: 1
    nodeSelector:
      workload: infrastructure
    persistence:
      enabled: true
      storageClass: kubernetes
      size: 50Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    existingSecret: minio-secret
    ingress:
      enabled: true
      ingressClassName: traefik-traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - minio.example.com
      tls:
        - secretName: minio-tls
          hosts:
            - minio.example.com
    consoleIngress:
      enabled: true
      ingressClassName: traefik-traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - minio-console.example.com
      tls:
        - secretName: minio-console-tls
          hosts:
            - minio-console.example.com
