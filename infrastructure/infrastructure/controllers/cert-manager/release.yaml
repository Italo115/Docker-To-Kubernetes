apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  targetNamespace: cert-manager
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    crds:
      enabled: true
      keep: true # prevents CRDs being deleted if you ever uninstall
    nodeSelector:
      workload: infrastructure
    webhook:
      nodeSelector:
        workload: infrastructure
    cainjector:
      nodeSelector:
        workload: infrastructure
    startupapicheck:
      nodeSelector:
        workload: infrastructure
