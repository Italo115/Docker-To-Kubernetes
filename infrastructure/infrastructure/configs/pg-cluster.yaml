apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-bookworm
  # Required so CNPG generates the postgres-superuser Secret that each app's
  # platform bootstrap Job uses to CREATE ROLE / CREATE DATABASE.
  enableSuperuserAccess: true
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2", memory: 2Gi }
  # Pin postgres pods to the dedicated postgres node pool.
  affinity:
    nodeSelector:
      workload: postgres
  storage:
    size: 50Gi
    storageClass: kubernetes
    pvcTemplate:
      accessModes: [ReadWriteOnce]
  # Roles are owned by each app's chart (platform bootstrap Job), NOT centrally.
  managed:
    roles: []
  # Stamp Reflector annotations onto every Secret CNPG generates so app namespaces
  # can mirror the superuser secret without copying credentials manually.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: pg-custom-queries
        key: queries
