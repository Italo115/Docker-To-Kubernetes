apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-wide resources that depend on CRDs from controllers/. Applied AFTER
# controllers reconcile (enforced by the per-cluster Kustomization dependsOn).
#
# Per-app databases are NOT declared here — each app's platform HelmRelease
# emits its own bootstrap Job that creates its role + database + grants. The
# central CNPG Cluster.spec.managed.roles list stays empty by design.
resources:
  - cluster-issuer.yaml
  - pg-cluster.yaml
  - pg-monitoring.yaml
  - postgres-ingressroute-tcp.yaml
