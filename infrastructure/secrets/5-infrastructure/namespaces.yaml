# Namespaces required by the Secrets in this directory. Declared HERE (not in
# infrastructure/controllers/<app>/namespace.yaml) so the Secrets can apply
# before the controllers reconcile — Flux's dependency chain is:
#   secrets-infrastructure  →  infrastructure  →  infrastructure-configs
# Each controller's kustomization.yaml no longer lists its own namespace.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
