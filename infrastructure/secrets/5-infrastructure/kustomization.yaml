apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-level secrets + the namespaces those secrets target. Owned by the
# secrets-infrastructure Flux Kustomization (clusters/my-cluster/secrets-infrastructure.yaml).
#   namespaces.yaml   — minio, cert-manager (declared here so secrets apply cleanly)
#   harbor-pull       — Harbor image pull dockerconfigjson (single source; Reflector mirrors to app-*)
#   cloudflare-api    — cert-manager DNS-01 token (referenced by ClusterIssuer)
#   minio-secret      — root credentials for the MinIO HelmRelease
resources:
  - namespaces.yaml
  - harbor-pull.yaml
  - cloudflare-api.yaml
  - minio-secret.yaml
