# ILLUSTRATIVE EXAMPLE ONLY — this is NOT a real encrypted secret.
#
# It shows the SHAPE of a SOPS/PGP-encrypted Secret so you can see what a
# committed, encrypted file looks like. To create a real one:
#
#   1. Write the plaintext Secret (see ../template-secret.yaml).
#   2. Encrypt it in place with your own key:  sops -e -i <file>.yaml
#      (the recipient fingerprint is picked up from ../../.sops.yaml)
#
# Do NOT reuse the placeholder ciphertext below — regenerate everything with
# your own GPG key.
apiVersion: v1
kind: Secret
metadata:
    name: NAME OF SECRET
    namespace: YOUR NAMESPACE
type: Opaque
stringData:
    JWT_SECRET: ENC[AES256_GCM,data:<ciphertext>,iv:<iv>,tag:<tag>,type:str]
    DB_PASS: ENC[AES256_GCM,data:<ciphertext>,iv:<iv>,tag:<tag>,type:str]
sops:
    lastmodified: "1970-01-01T00:00:00Z"
    mac: ENC[AES256_GCM,data:<mac>,iv:<iv>,tag:<tag>,type:str]
    pgp:
        - created_at: "1970-01-01T00:00:00Z"
          enc: |-
            -----BEGIN PGP MESSAGE-----

            <PGP session key block — regenerated by sops for your recipient key>
            -----END PGP MESSAGE-----
          fp: <YOUR_GPG_FINGERPRINT>
    encrypted_regex: ^(data|stringData|password|token|apiKey|secret|api-key|secretKey|accessKey)$
    version: 3.12.2
